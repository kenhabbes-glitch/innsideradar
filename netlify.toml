[build]
  publish = "public"
  command = "echo 'ingen bygg'"
  # Ikke publiser på nytt når bare datafilene er endret (sparer credits).
  # Appen leser data direkte fra GitHub. Exit-kode 0 = hopp over bygget.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)public/data'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# /api/... går til server-funksjonen (samme oppsett som SofaPilot)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
