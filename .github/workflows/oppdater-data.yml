name: Oppdater data

on:
  schedule:
    # hverdager, hver time fra ca. 08 til 19 norsk tid (cron er i UTC)
    - cron: "12 6-17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: oppdater-data
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hent short og innsidehandel
        run: node scripts/fetch.mjs
        continue-on-error: true
      - name: Hent kurser
        run: node scripts/prices.mjs
      - name: Hent makro (olje, valuta, rente, laks, strøm)
        run: node scripts/macro.mjs
        continue-on-error: true
      - name: Hent nøkkeltall (1 gang per døgn)
        run: node scripts/fundamentals.mjs
        continue-on-error: true
      - name: Hent børsmeldinger per selskap (1 gang per døgn)
        run: node scripts/news.mjs
        continue-on-error: true
      - name: Lagre endringer
        run: |
          git config user.name "innsideradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Ingen nye data."
          else
            git commit -m "Data $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
